plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"realisticdamage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file("junit.xml").get().getAsFile()}"
			runDir "build/gametest"
		}
		clientGametest {
			inherit client
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientgametest"
		}
	}
}

configurations {
	// Vivecraft for the client gametest run only; see runClientGametest below.
	vivecraftRuntime
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integration: the config screen is also reachable via keybind.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional integration: Vivecraft's public API (client/compat/Vr), only
	// touched once Vivecraft is known to be loaded.
	clientCompileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
	vivecraftRuntime("maven.modrinth:vivecraft:${project.vivecraft_version}") {
		transitive = false
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// Boots the Knot classloader so unit tests may touch Minecraft classes (codec round-trips).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
	// The stumbling-death tests keep every death they ran (thousands of whole
	// ragdolls, once per style) for the tests that read them.
	maxHeapSize = "2g"
}

// `./gradlew runClientGametest -PwithVivecraft` runs the suite with Vivecraft
// present (VivecraftClientGameTest drives it through its NullVR provider). The
// jar goes in the run's own mods folder, not on a classpath: on the client
// runtime classpath it also reached the unit tests, whose Knot loader then
// tried to apply Vivecraft's mixins and failed every test class.
tasks.matching { it.name == 'runClientGametest' }.configureEach {
	doFirst {
		def mods = file('build/clientgametest/mods')
		delete fileTree(mods) { include 'vivecraft-*.jar' }
		if (project.hasProperty('withVivecraft')) {
			copy {
				from configurations.vivecraftRuntime
				into mods
			}
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
